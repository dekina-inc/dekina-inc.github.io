paths:
  /token/issue:
    post:
      summary: API 키 발급
      description: |
        API 키를 발급하는 API 입니다.

        세션이 생성된 상태에서 호출할 수 있는 API로 로그인 후 해당 API 호출이 가능합니다.

        발급된 키 중 'client' 키는 일반적인 서비스 이용 시에 대한 사용자의 인증과 권한 확인 등에 사용됩니다.
        발급된 키 중 'secret' 키는 결제 서비스 등 민감한 서비스 이용 시에 대한 사용자의 인증과 권한 확인 등에 사용됩니다.
        
        이 키는 외부에 노출되지 않도록 특별히 주의하여 보관해야 하며, 외부 노출 시 즉시 재발급받아야 합니다.

        이 API에서 발생 가능한 에러 코드는 다음과 같습니다. (전체 에러 및 에러의 조치 방법에 대해서는 에러 코드 섹션 참조)
          - `401` : 인증 실패
      operationId: createToken      
      security: []  
      requestBody:
        description: 해당 API는 서버에 저장된 클라이언트의 세션 정보 기반으로 수행되며, 요청 본문은 필요로 하지 않습니다.
        content:
          application/json:
            schema:
              type: object
              properties: {}
      responses:
        '200':
          description: 요청 결과는 성공·실패 여부 모두 HTTP Status 200(OK)으로 반환 되며, 실제 성공·실패 여부는 응답 본문의 `code`, `msg` 필드로 구분합니다.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '../../components/response-bodies/issue-token.yaml#/components/schemas/ResponseBody'
                  - $ref: '../../components/response-bodies/error-response.yaml#/components/schemas/ErrorResponseBody'
