components:
  requestBodies:
    ReqeustBody:
      description: 로그인 인증번호 발송 요청 본문
      content:
        application/json:
          schema:
            type: object
            required:
              - id
              - pw
            properties:
              id:
                type: string
                description: 사용자 아이디
              pw:
                type: string
                description: 사용자 비밀번호
            example:
              id: test123
              pw: qwer123@
              